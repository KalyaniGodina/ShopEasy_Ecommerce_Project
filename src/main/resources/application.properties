spring.application.name=shopeasy
server.port=8081

# H2 file database (persists in ./data). To use MySQL, see README.
spring.datasource.url=jdbc:h2:file:./data/shopdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.error.include-message=always

# Session cookie (used for sign-in). SameSite=Lax protects against cross-site request forgery.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=2h

# Default admin account, created on first start. CHANGE THESE before deploying anywhere public.
app.admin.name=Store Admin
app.admin.email=admin@shopeasy.com
app.admin.password=Admin@12345
