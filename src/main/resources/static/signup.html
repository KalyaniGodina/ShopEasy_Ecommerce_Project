<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account - ShopEasy</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="logo" href="/">Shop<span>Easy</span></a>
    <h1>Create your account</h1>
    <p class="sub">It takes less than a minute.</p>
    <form id="signupForm" novalidate>
      <label>Full name
        <input name="name" type="text" autocomplete="name" placeholder="Your name" required>
      </label>
      <label>Email
        <input name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      </label>
      <label>Password
        <div class="pw">
          <input name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required>
          <button type="button" class="show-pw" data-toggle>Show</button>
        </div>
      </label>
      <label>Confirm password
        <input name="confirm" type="password" autocomplete="new-password" placeholder="Repeat password" required>
      </label>
      <div id="authError" class="error" role="alert"></div>
      <button class="primary" type="submit">Create account</button>
    </form>
    <p class="switch">Already have an account? <a id="otherLink" href="/login.html">Sign in</a></p>
    <p class="switch"><a href="/">&larr; Continue shopping</a></p>
  </main>
  <script src="/js/auth.js"></script>
</body>
</html>
